[project]
name = "flip-api"
version = "3.0.0"
description = "FLIP v3.0 Core API — FastAPI + Strawberry GraphQL + Temporal"
readme = "README.md"
requires-python = ">=3.12"

dependencies = [
    # Web framework
    "fastapi==0.115.4",
    "uvicorn[standard]==0.30.6",
    "httpx==0.27.2",

    # GraphQL
    "strawberry-graphql[fastapi]>=0.245.0",

    # Database
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg==0.29.0",
    "alembic==1.13.3",
    "psycopg[binary]>=3.2.1",

    # Settings
    "pydantic>=2.9.2",
    "pydantic-settings>=2.5.2",

    # Auth (Keycloak JWT)
    "python-jose[cryptography]>=3.3.0",
    "cryptography>=43.0.1",

    # NATS JetStream
    "nats-py>=2.7.2",

    # Object Storage (MinIO)
    "boto3==1.35.42",
    "minio==7.2.9",

    # Temporal Workflows
    "temporalio==1.6.0",

    # Observability
    "prometheus-client>=0.21.0",
    "structlog>=24.4.0",
    "opentelemetry-api>=1.27.0",
    "opentelemetry-sdk>=1.27.0",
    "opentelemetry-exporter-otlp>=1.27.0",
    "opentelemetry-instrumentation-fastapi>=0.48b0",
    "sentry-sdk[fastapi]>=2.16.0",

    # Geo
    "geojson>=3.1.0",
    "pyproj>=3.7.0",
    "shapely>=2.0.6",
    "geopandas>=1.0.1",

    # ML utilities
    "numpy>=2.1.2",
    "scikit-learn>=1.5.2",
    "mlflow==2.17.1",

    # AI/LLM (RAG Copilot)
    "langchain>=0.3.4",
    "langchain-community>=0.3.3",
    "pgvector>=0.3.3",
    "sentence-transformers>=3.2.1",

    # Notifications
    "twilio>=9.3.3",
    "httpx>=0.27.2",
    "aiosmtplib>=3.0.1",

    # Utilities
    "orjson>=3.10.9",
    "python-multipart>=0.0.12",
    "Pillow>=11.0.0",
    "python-dotenv>=1.0.1",
    "tenacity>=9.0.0",
    "croniter>=3.0.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.3",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.2",
    "factory-boy>=3.3.1",
    "faker>=30.3.0",
    "ruff>=0.7.0",
    "mypy>=1.11.2",
    "types-boto3>=1.0.2",
    "pre-commit>=3.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/flip_api"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "PTH", "PL", "RUF"]
ignore = ["PLR0913", "RUF012"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = ["-v", "--cov=src/flip_api", "--cov-report=term-missing"]
