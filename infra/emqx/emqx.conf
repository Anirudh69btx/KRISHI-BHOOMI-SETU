## EMQX Configuration — FLIP v3.0
## NATS JetStream Bridge + mTLS Listeners

## Node
node {
  name = "emqx@localhost"
  cookie = "emqx-secret-cookie"
  data_dir = "/opt/emqx/data"
}

## Cluster
cluster {
  name = emqxcl
  discovery_strategy = manual
}

## Logging
log {
  console {
    level = info
    enable = true
  }
  file {
    level = warning
    enable = true
    path = "/opt/emqx/log/emqx.log"
  }
}

## Listeners
listeners.tcp.default {
  bind = "0.0.0.0:1883"
  max_connections = 10000
  enable = true
}

## WebSocket Listener (for browser clients)
listeners.ws.default {
  bind = "0.0.0.0:8083"
  max_connections = 5000
  enable = true
}

## TLS / mTLS Listener (production: gateway and sensor nodes)
