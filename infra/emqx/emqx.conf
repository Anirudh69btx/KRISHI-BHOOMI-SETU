## MQTT Settings
mqtt {
  max_packet_size = 1MB
  max_qos_allowed = 2
  retain_available = true
  session_expiry_interval = 2h
  max_topic_levels = 10
}

## Authentication
## Dev: allow all. Prod: use JWT or mTLS cert-based auth.
authentication = [
  {
    mechanism = password_based
    backend = built_in_database
    enable = true
  }
]

## Authorization (ACL)
## Allow devices to publish only to their farm topics
authorization {
  no_match = allow
  deny_action = ignore
  cache {
    enable = true
    max_size = 32
    ttl = 1m
  }
  sources = [
    {
      type = built_in_database
      enable = true
    }
  ]
}

## NATS Bridge — Route farm.# MQTT topics to NATS JetStream
bridges.nats.farm_to_nats {
  enable = true
  connector {
    server = "nats://nats:4222"
    connect_timeout = 10s
    reconnect_interval = 5s
    max_reconnects = 10
  }
  ## Forward MQTT messages on farm.# to NATS subject farm.>
  egress {
    remote {
      subject = "${topic}"
    }
    local {
      topic = "farm/#"
      qos = 1
    }
  }
}

## Dashboard
dashboard {
  listeners.http {
    bind = "0.0.0.0:18083"
    enable = true
  }
  default_username = "admin"
  default_password = "public"
}

## Prometheus Metrics
prometheus {
  enable = true
  push_gateway_server = ""
  interval = 15s
  headers {}
  job_name = "emqx"
}
