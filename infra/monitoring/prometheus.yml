global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    env: local
    project: flip

rule_files:
  - /etc/prometheus/rules/*.yaml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: flip-core-api
    static_configs:
      - targets: ["core-api:8000"]
    metrics_path: /metrics

  - job_name: flip-nats
    static_configs:
      - targets: ["nats:8222"]
    metrics_path: /metrics

  - job_name: flip-emqx
    static_configs:
      - targets: ["emqx:18083"]
    metrics_path: /api/v5/prometheus/stats

  - job_name: flip-temporal
    static_configs:
      - targets: ["temporal:7233"]
    metrics_path: /metrics

  - job_name: flip-minio
    static_configs:
      - targets: ["minio:9000"]
    metrics_path: /minio/v2/metrics/cluster

  - job_name: flip-postgres
    static_configs:
      - targets: ["postgres:5432"]
