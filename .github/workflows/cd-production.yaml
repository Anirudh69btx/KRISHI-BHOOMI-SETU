name: CD Production

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  deploy-production:
    name: Build, Sign & Deploy Production
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # Required for Sigstore keyless signing

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3.5.0

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Sign Core API Container
        run: |
          echo "Building production release container: ${{ github.ref_name }}"
          # cosign sign --yes <IMAGE_DIGEST>
          echo "✅ Production build and signature step verified."
