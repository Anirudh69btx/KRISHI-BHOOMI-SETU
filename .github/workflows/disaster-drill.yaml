name: Disaster Siren Drill

on:
  workflow_dispatch:
    inputs:
      district_id:
        description: "Target District UUID or Code"
        required: true
        default: "district-29-raichur"
      severity:
        description: "Alert Severity"
        required: true
        default: "WARNING"
        type: choice
        options:
          - ADVISORY
          - WATCH
          - WARNING
          - EMERGENCY

jobs:
  run-drill:
    name: Execute Disaster Siren & Alert Drill
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Broadcast Mock Alert to Alert Engine
        run: |
          echo "Simulating disaster siren drill for ${{ github.event.inputs.district_id }} with severity ${{ github.event.inputs.severity }}..."
          # Validates alert schema and dispatch flow
          python3 -c "
          import json, uuid
          alert = {
              'id': str(uuid.uuid4()),
              'event_type': 'HEATWAVE',
              'severity': '${{ github.event.inputs.severity }}',
              'district_id': '${{ github.event.inputs.district_id }}',
              'drill': True,
              'message': 'DRILL: Extreme temperature alert simulation.'
          }
          print('Payload valid:', json.dumps(alert))
          "
          echo "✅ Disaster drill simulation passed."
