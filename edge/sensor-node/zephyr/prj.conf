# Zephyr Kernel & Logging
CONFIG_LOG=y
CONFIG_LOG_MODE_IMMEDIATE=y
CONFIG_PRINTK=y
CONFIG_CBPRINTF_FP_SUPPORT=y

# SoC & Target Architecture
CONFIG_SOC_ESP32C3=y
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048

# Hardware Drivers
CONFIG_GPIO=y
CONFIG_I2C=y
CONFIG_SPI=y
CONFIG_ADC=y

# Sensors
CONFIG_SENSOR=y
CONFIG_SHT4X=y
CONFIG_BH1750=y

# LoRa SX1262 Transceiver
CONFIG_LORA=y
CONFIG_LORA_SX126X=y

# Storage & LittleFS External/Internal Flash
CONFIG_FILE_SYSTEM=y
CONFIG_FILE_SYSTEM_LITTLEFS=y
CONFIG_FLASH_MAP=y
CONFIG_FLASH=y
CONFIG_FLASH_PAGE_LAYOUT=y

# Power Management & Deep Sleep
CONFIG_PM=y
CONFIG_PM_DEVICE=y

# Hardware Watchdog
CONFIG_WATCHDOG=y
CONFIG_WDT_DISABLE_AT_BOOT=n

# MCUboot & Secure OTA
CONFIG_BOOTLOADER_MCUBOOT=y
CONFIG_MCUBOOT_IMAGE_VERSION="1.0.0"
CONFIG_IMG_MANAGER=y
CONFIG_FLASH_MAP=y
CONFIG_STREAM_FLASH=y

# Cryptography & CBOR
CONFIG_TINYCBOR=y
CONFIG_CRYPTO=y
CONFIG_MBEDTLS=y
CONFIG_MBEDTLS_CIPHER=y
CONFIG_MBEDTLS_SHA256=y
CONFIG_MBEDTLS_ECDSA_DETERMINISTIC=y

# RTC / Real-Time Counter
CONFIG_COUNTER=y
